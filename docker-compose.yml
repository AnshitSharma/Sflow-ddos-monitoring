name: sflow-monitoring

# All UIs are bound to 127.0.0.1 so nothing is exposed publicly.
# Reach them from your laptop via SSH tunnel or through Apache reverse proxy.

services:
  # ---- METRICS pipeline: time-series storage (7-day retention) ----
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sflow-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # ---- FORENSICS pipeline: flow-record storage with full search ----
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: sflow-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true        # internal-only; bound to localhost
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"

  # ---- Reads sFlow-RT flow logs and writes them into OpenSearch ----
  collector:
    build: ./collector
    container_name: sflow-collector
    restart: unless-stopped
    depends_on: [opensearch]
    env_file: .env
    environment:
      - OPENSEARCH_URL=http://opensearch:9200

  # ---- Custom NOC Dashboard (Next.js, served at /dashboard/) ----
  webapp:
    build: ./webapp
    container_name: sflow-webapp
    restart: unless-stopped
    depends_on: [prometheus, opensearch]
    env_file: .env
    environment:
      - PROM_URL=http://prometheus:9090
      - OPENSEARCH_URL=http://opensearch:9200
      - NEXT_PUBLIC_BASE_PATH=/dashboard
      # SFLOWRT_URL / SFLOWRT_USER / SFLOWRT_PASS come from .env
    ports:
      - "3001:3000"

volumes:
  prometheus-data:
  opensearch-data:
