# Add this block inside the existing <VirtualHost *:443> for noc.bharatdatacenter.com.
# It reuses the SAME .htpasswd file already used for /sflow — no new passwords needed.
#
# Find your existing auth file:  grep -ri AuthUserFile /etc/httpd/
# Then set AuthUserFile below to match.
#
# After editing:  sudo apachectl configtest && sudo systemctl reload httpd

<Location /dashboard/>
    AuthType Basic
    AuthName "NOC Restricted"
    AuthUserFile /etc/httpd/.htpasswd
    Require valid-user

    ProxyPreserveHost On
    ProxyPass        http://127.0.0.1:3001/dashboard/
    ProxyPassReverse http://127.0.0.1:3001/dashboard/
</Location>
